name: Bug report
description: Report something in !Klein that behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. !Klein runs entirely on your machine and drives
        **local models** through a tool loop inside **fail-closed Docker isolation**, so the environment
        details below (model, Docker, egress posture) are usually what makes a bug reproducible.

        Please **do not paste secrets or private repository contents** — redact anything sensitive first.
        Security vulnerabilities should be reported privately instead (see the link on the "New issue" page,
        or `SECURITY.md`), not as a public bug report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the incorrect behavior, and what you expected instead.
      placeholder: I started a task with … and expected … but !Klein …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it. A dev-test scenario is ideal if it reproduces there.
      placeholder: |
        1. Create a project / open …
        2. Start a task with model …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "!Klein version / commit"
      description: The release tag, or `git rev-parse --short HEAD` if running from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL2)
        - Other (note it below)
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version
      description: Output of `node --version`.
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker Desktop / engine version + allocated memory
      description: >
        Task sandboxes run in Docker; heavy multi-task runs are sensitive to the VM's memory ceiling.
        e.g. "Docker Desktop 4.30, 12 GB". Say "n/a" if the bug is not task-execution related.
    validations:
      required: false
  - type: input
    id: model
    attributes:
      label: Model provider and model(s)
      description: e.g. "LM Studio, qwen3-8b" or "litellm → …". Include the loaded context length if relevant.
    validations:
      required: true
  - type: dropdown
    id: egress
    attributes:
      label: Egress posture
      description: "!Klein is offline by default; some flows require an explicitly enabled egress gate."
      options:
        - Default (offline / no egress)
        - Egress enabled
        - Not sure
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste terminal output or attach a screenshot. Redact paths/secrets. Long logs → a details block.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed any secrets, tokens, or private code from the details above.
          required: true
