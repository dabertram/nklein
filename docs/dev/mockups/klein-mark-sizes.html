<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#0a0c10;color:#e8eef5;font-family:system-ui;padding:30px;display:flex;flex-direction:column;gap:26px}
.row{display:flex;gap:34px;align-items:center} .lbl{width:220px;color:#63748a;font:11px ui-monospace}
svg{overflow:visible}
</style></head><body>
<div class="row"><span class="lbl">branded (klein cyan+violet) 16/18/24/40/72px</span>
<span id="b16"></span><span id="b18"></span><span id="b24"></span><span id="b40"></span><span id="b72"></span></div>
<div class="row"><span class="lbl">monochrome (currentColor) 16/18/24/40</span>
<span id="m16"></span><span id="m18"></span><span id="m24"></span><span id="m40"></span></div>
<div class="row"><span class="lbl">wordmark lockup 22px</span><span id="wm" style="font-weight:700;font-size:22px;display:inline-flex;align-items:center;gap:10px"></span></div>
<script>
function mark(size, accent, accent2){
  const worker = accent ?? "currentColor";
  const hub = accent2 ?? accent ?? "currentColor";
  const edge = accent ? `color-mix(in srgb, ${accent} 42%, transparent)` : "currentColor";
  const op = accent ? "" : ' opacity="0.4"';
  return `<svg width="${size}" height="${size}" viewBox="0 0 72 72" fill="none">
    <g stroke="${edge}" stroke-width="4" stroke-linecap="round"${op}>
      <line x1="20" y1="14" x2="20" y2="36"/><line x1="20" y1="36" x2="20" y2="58"/>
      <line x1="20" y1="36" x2="50" y2="14"/><line x1="20" y1="36" x2="50" y2="58"/></g>
    <circle cx="20" cy="14" r="5.5" fill="${worker}"/><circle cx="20" cy="58" r="5.5" fill="${worker}"/>
    <circle cx="50" cy="14" r="5.5" fill="${worker}"/><circle cx="50" cy="58" r="5.5" fill="${worker}"/>
    <circle cx="20" cy="36" r="7" fill="${hub}"/></svg>`;
}
for (const s of [16,18,24,40,72]) document.getElementById("b"+s).innerHTML = mark(s, "#3FE0E0", "#9D7BFF");
for (const s of [16,18,24,40]) document.getElementById("m"+s).innerHTML = mark(s, null, null);
document.getElementById("wm").innerHTML = mark(29,"#3FE0E0","#9D7BFF") + '<span><span style="color:#3FE0E0">!</span>Klein</span>';
</script></body></html>
