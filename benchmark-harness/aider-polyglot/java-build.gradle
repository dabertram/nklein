plugins {
    id "java"
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.assertj:assertj-core:3.25.1"
}

test {
    useJUnitPlatform()
}

tasks.register("seedTestDependencies") {
    doLast {
        [configurations.testCompileClasspath, configurations.testRuntimeClasspath].each { configuration ->
            configuration.files.each { file ->
                logger.lifecycle("cached ${configuration.name}: ${file.name}")
            }
        }
    }
}
